events {}

http {
    upstream backend {
        # Cloud Map resolves this private ECS service name.
        server backend.ecs-test.local:5000;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Requests beginning with /api/ are sent to the private backend.
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Nginx exporter reads this endpoint locally.
        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }

        # ALB health check.
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "frontend ok\n";
        }
    }
}