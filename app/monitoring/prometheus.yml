global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend.ecs-test.local:5000

  - job_name: nginx
    static_configs:
      - targets:
          - frontend.ecs-test.local:9113

  - job_name: cloudwatch-exporter
    static_configs:
      - targets:
          - 127.0.0.1:9106